# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id || github.ref_name }}: ${{ github.event.inputs.name || format('Run by {0}', github.triggering_actor) }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

permissions:
  contents: write

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config || 'linux,windows,macos' }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Smoke-test ED2 binary
        shell: Rscript {0}
        run: |
          source("tools/smoke_test_binary_package.R")

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - name: Smoke-test ED2 binary
        shell: Rscript {0}
        run: |
          source("tools/smoke_test_binary_package.R")

  release-binaries:
    needs: [linux-containers, other-platforms]
    if: ${{ always() && github.ref_type == 'tag' && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rhub-artifacts
      - name: Prepare binary packages
        shell: Rscript {0}
        run: |
          dir.create("release-assets", showWarnings = FALSE)

          archives <- list.files(
            "rhub-artifacts",
            pattern = "^rED2_.*[.](zip|tgz|tar[.]gz)$",
            full.names = TRUE,
            recursive = TRUE
          )
          version <- sub("^refs/tags/v?", "", Sys.getenv("GITHUB_REF"))
          source_archive <- sprintf("rED2_%s.tar.gz", version)
          archives <- archives[basename(archives) != source_archive]

          if (!length(archives)) {
            stop("No binary package archives found in Rhub artifacts.", call. = FALSE)
          }

          for (archive in archives) {
            rel <- sub("^rhub-artifacts[/\\\\]", "", archive)
            artifact <- strsplit(rel, "[/\\\\]")[[1]][[1]]
            label <- gsub("[^A-Za-z0-9._-]+", "-", artifact)
            dest <- file.path("release-assets", paste0(label, "-", basename(archive)))
            file.copy(archive, dest, overwrite = TRUE)
            cat("Prepared release asset:", dest, "\n")
          }
      - name: Upload binary packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
