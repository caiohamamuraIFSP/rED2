# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id || github.ref_name }}: ${{ github.event.inputs.name || format('Run by {0}', github.triggering_actor) }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'windows,intel,m1-san'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

permissions:
  contents: write

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config || 'windows,intel,m1-san' }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }} (${{ matrix.mpi }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
        mpi: [serial, mpi]
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Install Intel oneAPI on Linux
        if: ${{ matrix.config.label == 'intel' }}
        run: |
          if ! command -v icx >/dev/null 2>&1 || ! command -v ifx >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y ca-certificates gpg-agent wget
              wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
                | gpg --dearmor \
                | tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
              echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
                > /etc/apt/sources.list.d/oneAPI.list
              apt-get update
              apt-get install -y --no-install-recommends \
                intel-oneapi-compiler-dpcpp-cpp \
                intel-oneapi-compiler-fortran \
                intel-oneapi-mpi-devel
            elif command -v dnf >/dev/null 2>&1 || command -v yum >/dev/null 2>&1; then
              pm=dnf
              command -v dnf >/dev/null 2>&1 || pm=yum
              mkdir -p /etc/yum.repos.d
              cat > /etc/yum.repos.d/oneAPI.repo <<'EOF'
          [oneAPI]
          name=Intel oneAPI repository
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          EOF
              "$pm" install -y \
                intel-oneapi-compiler-dpcpp-cpp \
                intel-oneapi-compiler-fortran \
                intel-oneapi-mpi-devel
            else
              echo "No supported package manager found for Intel oneAPI installation." >&2
              exit 1
            fi
          fi
      - name: Configure Intel compilers
        if: ${{ matrix.config.label == 'intel' }}
        run: |
          if [ -f /opt/intel/oneapi/setvars.sh ]; then
            set +u
            . /opt/intel/oneapi/setvars.sh >/dev/null
            set -u
            echo "PATH=$PATH" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            if [ -n "${I_MPI_ROOT:-}" ]; then
              echo "I_MPI_ROOT=$I_MPI_ROOT" >> "$GITHUB_ENV"
            fi
          fi
          echo "CC=icx" >> "$GITHUB_ENV"
          echo "CXX=icpx" >> "$GITHUB_ENV"
          echo "FC=ifx" >> "$GITHUB_ENV"
          echo "F77=ifx" >> "$GITHUB_ENV"
      - name: Install MPI launcher
        if: ${{ matrix.mpi == 'mpi' && matrix.config.label != 'intel' }}
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y mpich
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y mpich
          elif command -v yum >/dev/null 2>&1; then
            yum install -y mpich
          fi
      - uses: r-hub/actions/run-check@v1
        env:
          RED2_ENABLE_MPI: ${{ matrix.mpi == 'mpi' && 'yes' || 'no' }}
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Smoke-test ED2 binary
        shell: Rscript {0}
        run: |
          source("tools/smoke_test_binary_package.R")
      - name: Save release binary package
        if: ${{ github.ref_type == 'tag' && matrix.config.label == 'intel' }}
        shell: Rscript {0}
        run: |
          dir.create("release-assets", showWarnings = FALSE)
          archives <- list.files(
            "check",
            pattern = "^rED2_.*[.](zip|tgz|tar[.]gz)$",
            full.names = TRUE,
            recursive = TRUE
          )
          version <- sub("^refs/tags/v?", "", Sys.getenv("GITHUB_REF"))
          archives <- archives[basename(archives) != sprintf("rED2_%s.tar.gz", version)]
          if (!length(archives)) stop("No binary package archive found under check.", call. = FALSE)
          archive <- archives[order(file.info(archives)$mtime, decreasing = TRUE)][[1]]
          dest <- file.path(
            "release-assets",
            sprintf("rED2-%s-%s-%s", "${{ matrix.config.label }}", "${{ matrix.mpi }}", basename(archive))
          )
          file.copy(archive, dest, overwrite = TRUE)
          cat("Prepared release asset:", dest, "\n")
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_type == 'tag' && matrix.config.label == 'intel' }}
        with:
          name: red2-binary-${{ matrix.config.label }}-${{ matrix.mpi }}
          path: release-assets/*

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }} (${{ matrix.mpi }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}
        mpi: [serial, mpi]

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Install HDF5 on m1-san
        if: ${{ startsWith(matrix.config.label, 'm1-san') }}
        run: |
          brew update
          brew install cmake || brew upgrade cmake
          if [ "${{ matrix.mpi }}" = "mpi" ]; then
            brew install open-mpi || brew upgrade open-mpi
            echo "PATH=$(brew --prefix open-mpi)/bin:${PATH}" >> "$GITHUB_ENV"
            export PATH="$(brew --prefix open-mpi)/bin:${PATH}"
            export HDF5_FC=mpifort
            hdf5_prefix="$RUNNER_TEMP/hdf5-rED2-mpi"
          else
            export HDF5_FC=/opt/gfortran/bin/gfortran
            export HDF5_FFLAGS="-arch arm64"
            hdf5_prefix="$RUNNER_TEMP/hdf5-rED2-serial"
          fi
          hdf5_prefix=$(sh tools/build_hdf5_fortran_macos.sh "$hdf5_prefix" | tail -n 1)
          echo "RED2_HDF5_ROOT=$hdf5_prefix" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$hdf5_prefix/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Install Intel oneAPI on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $wingetLog = Join-Path $env:RUNNER_TEMP 'winget-oneapi-hpc.log'

          if (-not (Get-Command ifx -ErrorAction SilentlyContinue) -or
              -not (Get-Command icx -ErrorAction SilentlyContinue) -or
              -not (Get-Command mpiexec -ErrorAction SilentlyContinue)) {
            winget install --id Intel.OneAPI.HPCToolkit -e `
              --silent `
              --disable-interactivity `
              --accept-package-agreements `
              --accept-source-agreements `
              --override "--silent --eula accept -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0" `
              *> $wingetLog
          }

          if (Test-Path $wingetLog) {
            Get-Content $wingetLog -Tail 80
          }

          $compilerRoot = Get-ChildItem 'C:\Program Files (x86)\Intel\oneAPI\compiler' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $compilerBin = Join-Path $compilerRoot.FullName 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $compilerBin
          $mpiRoot = Get-ChildItem 'C:\Program Files (x86)\Intel\oneAPI\mpi' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($mpiRoot) {
            Add-Content -Path $env:GITHUB_ENV -Value "I_MPI_ROOT=$($mpiRoot.FullName)"
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $mpiRoot.FullName 'bin')
          } elseif ("${{ matrix.mpi }}" -eq "mpi") {
            throw "Intel MPI was not found after oneAPI installation; mpiexec is required for the MPI smoke test."
          }
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=icx'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXX=icpx'
          Add-Content -Path $env:GITHUB_ENV -Value 'FC=ifx'
          Add-Content -Path $env:GITHUB_ENV -Value 'F77=ifx'
          Add-Content -Path $env:GITHUB_ENV -Value 'RED2_WINDOWS_TOOLCHAIN=intel'
      - name: Install MPI launcher on macOS
        if: ${{ matrix.mpi == 'mpi' && startsWith(matrix.config.label, 'm1-san') }}
        run: |
          brew install open-mpi || brew upgrade open-mpi
          echo "PATH=$(brew --prefix open-mpi)/bin:${PATH}" >> "$GITHUB_ENV"
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        env:
          RED2_ENABLE_MPI: ${{ matrix.mpi == 'mpi' && 'yes' || 'no' }}
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - name: Smoke-test ED2 binary
        shell: Rscript {0}
        run: |
          source("tools/smoke_test_binary_package.R")
      - name: Save release binary package
        if: ${{ github.ref_type == 'tag' && matrix.config.label == 'intel' }}
        shell: Rscript {0}
        run: |
          dir.create("release-assets", showWarnings = FALSE)
          archives <- list.files(
            "check",
            pattern = "^rED2_.*[.](zip|tgz|tar[.]gz)$",
            full.names = TRUE,
            recursive = TRUE
          )
          version <- sub("^refs/tags/v?", "", Sys.getenv("GITHUB_REF"))
          archives <- archives[basename(archives) != sprintf("rED2_%s.tar.gz", version)]
          if (!length(archives)) stop("No binary package archive found under check.", call. = FALSE)
          archive <- archives[order(file.info(archives)$mtime, decreasing = TRUE)][[1]]
          dest <- file.path(
            "release-assets",
            sprintf("rED2-%s-%s-%s", "${{ matrix.config.label }}", "${{ matrix.mpi }}", basename(archive))
          )
          file.copy(archive, dest, overwrite = TRUE)
          cat("Prepared release asset:", dest, "\n")
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_type == 'tag' && matrix.config.label == 'intel' }}
        with:
          name: red2-binary-${{ matrix.config.label }}-${{ matrix.mpi }}
          path: release-assets/*

  release-binaries:
    needs: [linux-containers, other-platforms]
    if: ${{ always() && github.ref_type == 'tag' && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: red2-binary-*
          path: release-assets
          merge-multiple: true
      - name: Upload binary packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
